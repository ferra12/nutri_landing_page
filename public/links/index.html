<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dott.ssa Giulia Da Dalt – Biologa Nutrizionista. Tutti i link ufficiali.">
  <meta name="robots" content="noindex">
  <title>Link | Dott.ssa Giulia Da Dalt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .links-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      background: var(--sage-lightest);
    }
    .links-card {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    .links-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      margin: 0 auto 20px;
      box-shadow: var(--shadow-md);
    }
    .links-name {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      margin-bottom: 6px;
    }
    .links-role {
      color: var(--sage-dark);
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 40px;
    }
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .links-list a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--white);
      color: var(--text-dark);
      padding: 18px 24px;
      border-radius: var(--radius-full);
      font-weight: 500;
      font-size: 0.98rem;
      border: 1.5px solid var(--border-color);
      transition: transform var(--t), border-color var(--t), color var(--t), box-shadow var(--t);
    }
    .links-list a:hover {
      border-color: var(--sage);
      color: var(--sage-dark);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
    .links-list svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <main class="links-page">
    <div class="links-card">
      <img src="/img/profilo.jpeg" alt="Dott.ssa Giulia Da Dalt" class="links-avatar">
      <h1 class="links-name">Dott.ssa Giulia Da Dalt</h1>
      <p class="links-role">Biologa Nutrizionista</p>

      <nav class="links-list" aria-label="Link ufficiali">
        <a href="https://giuliadadalt.it/" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 0 20M12 2a15.3 15.3 0 0 0 0 20"/></svg>
          Sito web
        </a>
        <a href="https://www.instagram.com/dr.ssa_giuliadadalt/" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
          Instagram
        </a>
        <a href="https://www.facebook.com/profile.php?id=61595349815251" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 22v-8h2.7l.4-3.2h-3.1V8.7c0-.9.3-1.5 1.6-1.5h1.7V4.3c-.3 0-1.3-.1-2.4-.1-2.4 0-4 1.4-4 4.1v2.5H7.7V14h2.6v8h3.2z"/></svg>
          Facebook
        </a>
        <a href="https://share.google/vmV9ta0a2f5XEG8yG" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          Google
        </a>
      </nav>
    </div>
  </main>
</body>
</html>
