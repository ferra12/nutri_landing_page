services:
  - type: web
    name: nutri-landing-page
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false   # set in Render dashboard
      - key: SMTP_PASS
        sync: false   # set in Render dashboard (use App Password for Gmail)
      - key: CONTACT_EMAIL
        sync: false   # email address that receives contact form messages
